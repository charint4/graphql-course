services:
  app:
    build: .
    image: game-review-backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: ${PORT:-8000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/graphql-course}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: